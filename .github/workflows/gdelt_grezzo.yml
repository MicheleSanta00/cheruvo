name: Cheruvo — Quanto rende GDELT grezzo?

# Misura, non raccolta. Scarica UN file dei feed pubblicati ogni 15 minuti,
# conta quanti articoli parlano davvero delle nostre monete e proietta il dato
# su una giornata. Non scrive niente nel database.
#
# Serve a decidere con un numero, invece che con un'intuizione, se valga la
# pena costruire un ingeritore sui file grezzi al posto dell'API.

on:
  workflow_dispatch:
    inputs:
      file:
        description: 'Timestamp preciso (es. 20260806180000). Vuoto = ultimo pubblicato'
        required: false
        default: ''
        type: string

jobs:
  misura:
    name: misura
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-actions.txt

      - name: Installa dipendenze
        run: pip install -r requirements-actions.txt

      # Nessun DATABASE_URL: questo strumento non scrive niente, e non
      # passargli il segreto è il modo più solido di garantirlo.
      - name: Misura
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          if [ -n "${{ github.event.inputs.file }}" ]; then
            python backend/gdelt_grezzo.py --file ${{ github.event.inputs.file }}
          else
            python backend/gdelt_grezzo.py
          fi
