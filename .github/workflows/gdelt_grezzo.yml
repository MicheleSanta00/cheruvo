name: Cheruvo — Quanto rende GDELT grezzo?

# Misura, non raccolta. Scarica UN file dei feed pubblicati ogni 15 minuti,
# conta quanti articoli parlano davvero delle nostre monete e proietta il dato
# su una giornata. Non scrive niente nel database.
#
# Serve a decidere con un numero, invece che con un'intuizione, se valga la
# pena costruire un ingeritore sui file grezzi al posto dell'API.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'Cosa misurare'
        required: true
        default: 'lingue'
        type: choice
        options:
          - lingue    # quante notizie il filtro butta via, lingua per lingua
          - candidati # quante notizie porterebbe ogni moneta nuova
          - sigle     # quanto porterebbe cercare BTC oltre a Bitcoin
          - colonne   # quanto porterebbero temi, organizzazioni e nomi propri
          - resa      # la resa complessiva di un file (la domanda del 6 agosto)
      ore:
        description: 'Quante ore di file leggere (6 = 48 file, circa 1 minuto)'
        required: false
        default: '6'
        type: string
      file:
        description: 'Un solo file, timestamp preciso. Serve a provare il codice, non a misurare'
        required: false
        default: ''
        type: string

jobs:
  misura:
    name: misura
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-actions.txt

      - name: Installa dipendenze
        run: pip install -r requirements-actions.txt

      # Nessun DATABASE_URL: questo strumento non scrive niente, e non
      # passargli il segreto è il modo più solido di garantirlo.
      - name: Misura
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          MODO: ${{ github.event.inputs.modo }}
          ORE:  ${{ github.event.inputs.ore }}
          FILE: ${{ github.event.inputs.file }}
        run: |
          # Gli input passano da variabili d'ambiente e non interpolati nello
          # script: il repository è pubblico, e un valore interpolato dentro
          # una riga di shell è il modo classico di farci entrare un comando.
          ARGS="--modo ${MODO:-lingue} --ore ${ORE:-6}"
          [ -n "$FILE" ] && ARGS="$ARGS --file $FILE"
          python backend/gdelt_grezzo.py $ARGS
