name: Cheruvo — Pulizia news senza licenza

# Perché passa da qui e non dal tuo computer. Lo script ha bisogno di
# DATABASE_URL, che è il segreto del database di produzione. Averlo in chiaro
# sul portatile è un rischio inutile: qui il segreto è già configurato, lo usa
# solo GitHub e non compare mai nei log.
#
# Solo avvio manuale. Non è un lavoro ricorrente: si esegue una volta per
# togliere l'arretrato di Google News, Yahoo e NewsAPI rimasto in archivio da
# prima che staccassimo quelle fonti. Da allora quelle righe non si creano più
# (vedi la catena fonti in backend/quick_fetch.py), quindi non c'è nulla da
# ripulire con cadenza fissa.

on:
  workflow_dispatch:
    inputs:
      azione:
        description: 'Cosa fare'
        required: true
        default: 'censimento'
        type: choice
        options:
          - censimento   # conta e basta, non tocca niente
          - elimina      # cancella davvero, definitivo

jobs:
  pulizia:
    name: ${{ github.event.inputs.azione }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-actions.txt

      - name: Installa dipendenze
        run: pip install -r requirements-actions.txt

      # Due passi distinti invece di uno con un "if" dentro: così il pulsante
      # verde di GitHub dice a colpo d'occhio quale dei due è stato eseguito,
      # e non serve aprire i log per sapere se è stato cancellato qualcosa.
      - name: Censimento (nessuna modifica)
        if: github.event.inputs.azione == 'censimento'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH:   ${{ github.workspace }}/backend
        run: python backend/pulizia_licenze.py

      - name: Eliminazione definitiva
        if: github.event.inputs.azione == 'elimina'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH:   ${{ github.workspace }}/backend
        run: python backend/pulizia_licenze.py --elimina

      - name: Riepilogo
        if: always()
        run: |
          echo "Azione richiesta: ${{ github.event.inputs.azione }}"
          echo "Esito: ${{ job.status }}"
          echo ""
          echo "Il censimento non modifica nulla e si può ripetere a piacere."
          echo "L'eliminazione è definitiva e abbassa il totale news in home."
