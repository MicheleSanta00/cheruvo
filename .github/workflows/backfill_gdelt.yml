name: Cheruvo — Ricostruisci storico da GDELT

# Ricostruisce l'archivio news pescando indietro nel tempo da GDELT, che ha
# licenza commerciale libera. Serve a non ritrovarsi con 451 notizie il giorno
# in cui cancelliamo le 32.675 righe senza licenza.
#
# Gira qui e non sul portatile per due motivi: il segreto DATABASE_URL è già
# configurato, e l'indirizzo IP di GitHub non è sotto il rate limit di GDELT,
# che invece scatta facilmente su una connessione di casa usata per provare.

on:
  workflow_dispatch:
    inputs:
      mercati:
        description: 'Quali titoli (ignorato se compili "ticker")'
        required: true
        default: 'crypto'
        type: choice
        options:
          - crypto   # 20 monete in UNA interrogazione: pochi minuti
          - azioni   # gli 11 titoli USA costano una chiamata ciascuno
          - tutti
      ticker:
        description: 'Un solo titolo, es. BTC-USD (molto più efficace per quello)'
        required: false
        default: ''
        type: string
      giorni:
        description: 'Quanti giorni indietro'
        required: true
        default: '90'
        type: string
      solo_prova:
        description: 'Solo verifica, senza scrivere niente'
        required: true
        default: false
        type: boolean

jobs:
  backfill:
    name: ${{ github.event.inputs.mercati }} — ${{ github.event.inputs.giorni }} giorni
    runs-on: ubuntu-latest
    # Generoso di proposito: GDELT impone 5 secondi fra una chiamata e
    # l'altra, quindi il lavoro è lento per costruzione. Lo script si ferma
    # comunque da solo dopo --limite-minuti, ben prima di questo tetto.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-actions.txt

      - name: Installa dipendenze
        run: pip install -r requirements-actions.txt

      - name: Verifica che GDELT accetti le finestre storiche
        if: github.event.inputs.solo_prova == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH:   ${{ github.workspace }}/backend
        run: python backend/backfill_gdelt.py --prova

      - name: Ricostruisci
        if: github.event.inputs.solo_prova != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONPATH:   ${{ github.workspace }}/backend
        run: |
          ARGS="--giorni ${{ github.event.inputs.giorni }} --pausa 10 --limite-minuti 60"
          if [ -n "${{ github.event.inputs.ticker }}" ]; then
            ARGS="$ARGS --ticker ${{ github.event.inputs.ticker }}"
          else
            ARGS="$ARGS --mercati ${{ github.event.inputs.mercati }}"
          fi
          echo "Comando: python backend/backfill_gdelt.py $ARGS"
          python backend/backfill_gdelt.py $ARGS

      - name: Riepilogo
        if: always()
        run: |
          echo "Mercati: ${{ github.event.inputs.mercati }}"
          echo "Giorni:  ${{ github.event.inputs.giorni }}"
          echo "Esito:   ${{ job.status }}"
          echo ""
          echo "Rilanciarlo è sicuro: i doppioni vengono scartati al salvataggio."
