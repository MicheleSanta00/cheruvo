name: Backfill sentiment (auto)

# Bonifica lo storico: ri-classifica con l'AI le news ancora con score VADER
# (colonna di "neutri" a 0.00). Parte DA SOLO ogni 2 ore e riprende da dove
# era rimasto; quando il riepilogo dice "ancora da ripassare: 0" ogni run
# dura meno di un minuto e resta come rete di sicurezza per il futuro.
# Si può comunque lanciare a mano da Actions → Run workflow.
on:
  workflow_dispatch:
    inputs:
      max_updates:
        description: "Quante news al massimo ripassare in questo run"
        required: false
        default: "1500"
  schedule:
    # Una volta al giorno. Prima girava ogni 2 ore (12 run al giorno) ed è
    # questo che ha bruciato i minuti Actions del mese: con lo storico da
    # ripassare ogni run poteva durare decine di minuti. Da bonifica finita
    # il backfill è solo una rete di sicurezza, una passata al giorno basta.
    - cron: "23 3 * * *"

# Mai due backfill in parallelo (si pesterebbero i piedi sui rate limit)
concurrency:
  group: backfill-sentiment
  cancel-in-progress: false

jobs:
  backfill:
    name: Ripassa storico sentiment
    runs-on: ubuntu-latest
    # Freno di sicurezza: un run bloccato non può più divorare un'ora di quota
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-actions.txt

      - name: Installa dipendenze
        run: pip install -r requirements-actions.txt

      - name: Backfill
        env:
          DATABASE_URL:     ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          GROQ_SCORE_MODEL: openai/gpt-oss-20b
          BACKFILL_MAX:     ${{ github.event.inputs.max_updates || '1500' }}
          PYTHONPATH:       ${{ github.workspace }}/backend
        run: python backfill_sentiment.py
