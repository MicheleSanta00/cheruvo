name: Backfill sentiment (una tantum)

# Bonifica lo storico: ri-classifica con l'AI le news ancora con score VADER
# (colonna di "neutri" a 0.00). Si avvia SOLO a mano; rilancialo finché il
# riepilogo dice "ancora da ripassare: 0". Riprende da solo dove era rimasto.
on:
  workflow_dispatch:
    inputs:
      max_updates:
        description: "Quante news al massimo ripassare in questo run"
        required: false
        default: "6000"

jobs:
  backfill:
    name: Ripassa storico sentiment
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-actions.txt

      - name: Installa dipendenze
        run: pip install -r requirements-actions.txt

      - name: Backfill
        env:
          DATABASE_URL:     ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          GROQ_SCORE_MODEL: llama-3.1-8b-instant
          BACKFILL_MAX:     ${{ github.event.inputs.max_updates }}
          PYTHONPATH:       ${{ github.workspace }}/backend
        run: python backfill_sentiment.py
