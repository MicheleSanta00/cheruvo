name: Cheruvo — Aggiorna news e alert

on:
  schedule:
    - cron: '0 */6 * * *'   # ogni 6 ore: 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:          # esecuzione manuale dal tab Actions su GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15       # se supera 15 min, fallisce (evita run infiniti)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Installa dipendenze
        run: pip install -r backend/requirements.txt

      - name: Aggiorna news e invia alert PRO
        env:
          # — API news
          ALPHA_VANTAGE: ${{ secrets.ALPHA_VANTAGE }}
          NEWSAPI: ${{ secrets.NEWSAPI }}
          FMP: ${{ secrets.FMP }}
          # — Reddit
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          # — Database
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # — Alert email (Resend)
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          # — Python path
          PYTHONPATH: ${{ github.workspace }}
        run: python updater.py

      - name: Risultato
        if: always()
        run: echo "Job completato con status ${{ job.status }}"