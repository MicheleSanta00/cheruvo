name: Cheruvo — Aggiorna news e alert

on:
  schedule:
    - cron: '0 6,12,18,0 * * *'   # 4 volte al giorno: 06:00, 12:00, 18:00, 00:00 UTC
  workflow_dispatch:                # avvio manuale dalla UI di GitHub

# Il keep-alive ogni 10 minuti è stato sostituito da UptimeRobot (esterno, gratuito):
# stesso effetto anti cold-start, zero minuti di GitHub Actions consumati.

jobs:
  # ── Test ────────────────────────────────────────────────────────────────
  test:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Gira solo sul cron delle 4 volte/giorno e workflow_dispatch
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule != '*/10 * * * *')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Installa dipendenze backend
        run: pip install -r backend/requirements.txt

      - name: Esegui test
        run: |
          cd backend
          pytest -v --tb=short
        env:
          DATABASE_URL: postgresql://fake:fake@localhost/fake
          GROQ_API_KEY: gsk_fake_key_for_tests
          STRIPE_SECRET_KEY: sk_test_fake
          STRIPE_WEBHOOK_SECRET: whsec_fake
          STRIPE_PRICE_ID: price_fake

  # ── Fetch news + Alert PRO ───────────────────────────────────────────────
  update:
    name: Fetch news + Alert PRO
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule != '*/10 * * * *')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-actions.txt

      - name: Installa dipendenze
        run: pip install -r requirements-actions.txt

      - name: Fetch news e invia alert PRO
        env:
          ALPHA_VANTAGE:           ${{ secrets.ALPHA_VANTAGE }}
          NEWSAPI:                 ${{ secrets.NEWSAPI }}
          DATABASE_URL:            ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY:          ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL:              ${{ secrets.FROM_EMAIL }}
          FRONTEND_URL:            ${{ secrets.FRONTEND_URL }}
          GROQ_API_KEY:            ${{ secrets.GROQ_API_KEY }}
          PYTHONPATH:              ${{ github.workspace }}/backend
        run: python updater.py

      - name: Riepilogo
        if: always()
        run: |
          echo "Job: ${{ job.status }}"
          echo "Run: ${{ github.run_number }} — ${{ github.event_name }}"
