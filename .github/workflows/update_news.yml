name: Cheruvo — Aggiorna news e alert (FinBERT)

on:
  schedule:
    - cron: '0 */8 * * *'   # ogni 8 ore (~2160 min/mese, entro il free tier GitHub Actions)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25      # FinBERT richiede più tempo di VADER

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-actions.txt

      - name: Installa dipendenze FinBERT
        run: pip install -r requirements-actions.txt

      - name: Cache modello FinBERT
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: finbert-${{ runner.os }}-v1

      - name: Aggiorna news con FinBERT e invia alert PRO
        env:
          ALPHA_VANTAGE:       ${{ secrets.ALPHA_VANTAGE }}
          NEWSAPI:             ${{ secrets.NEWSAPI }}
          FMP:                 ${{ secrets.FMP }}
          REDDIT_CLIENT_ID:    ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          DATABASE_URL:        ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY:      ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL:          ${{ secrets.FROM_EMAIL }}
          FRONTEND_URL:        ${{ secrets.FRONTEND_URL }}
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
        run: python updater.py

      - name: Risultato
        if: always()
        run: echo "Job completato con status ${{ job.status }}"